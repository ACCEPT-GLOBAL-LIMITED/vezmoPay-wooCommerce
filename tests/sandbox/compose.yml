# The sandbox every [S] case in docs/TEST-CHECKLIST.md is run against.
#
# WordPress + WooCommerce with this plugin bind-mounted READ-ONLY, and a mock
# VezmoPay API (tests/sandbox/mu-plugins) that behaves like the real platform in
# the ways that matter: idempotent payment creation, a payment that reads
# INITIATED until it is actually charged, and a checkout form that reports the
# same postMessage events the real one does — including reporting nothing at
# all, which is what a declined card does today.
#
#   cd tests/sandbox && docker compose up -d && ./setup.sh
#   node regress.mjs box element success
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: wproot
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  wordpress:
    image: wordpress:6-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
    volumes:
      - wp:/var/www/html
      # Read-only on purpose: the sandbox must never be able to edit the plugin
      # it is testing.
      - ../../:/var/www/html/wp-content/plugins/vezmopay-woocommerce:ro

  cli:
    image: wordpress:cli-php8.3
    depends_on:
      - wordpress
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
    volumes:
      - wp:/var/www/html
      - ../../:/var/www/html/wp-content/plugins/vezmopay-woocommerce:ro
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  wp:
